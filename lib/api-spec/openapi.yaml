openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Shared couple login
  - name: savings
    description: Wedding fund tracking
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in to the wedding fund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed-in couple member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getCurrentMember
      tags: [auth]
      summary: Get the current signed-in member
      responses:
        "200":
          description: Signed-in member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "204":
          description: Signed out
  /savings/summary:
    get:
      operationId: getSavingsSummary
      tags: [savings]
      summary: Get the wedding fund summary
      responses:
        "200":
          description: Current progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsSummary"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /savings/entries:
    get:
      operationId: listSavingsEntries
      tags: [savings]
      summary: List all contributions
      responses:
        "200":
          description: Contributions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavingsEntry"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createSavingsEntry
      tags: [savings]
      summary: Add a contribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavingsEntryInput"
      responses:
        "201":
          description: Created contribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsEntry"
        "400":
          description: Invalid contribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    LoginInput:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required: [username, password]
    Member:
      type: object
      properties:
        username:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [bride, groom]
      required: [username, name, role]
    SavingsEntryInput:
      type: object
      properties:
        amount:
          type: number
          minimum: 0.01
        occurredAt:
          type: string
          format: date-time
        summary:
          type: string
          minLength: 1
          maxLength: 240
        category:
          type: string
          enum: [salary, gift, side-income, other]
      required: [amount, occurredAt, summary, category]
    SavingsEntry:
      type: object
      properties:
        id:
          type: number
        amount:
          type: number
        occurredAt:
          type: string
          format: date-time
        summary:
          type: string
        category:
          type: string
          enum: [salary, gift, side-income, other]
        addedBy:
          type: string
        addedByName:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, amount, occurredAt, summary, category, addedBy, addedByName, createdAt]
    SavingsSummary:
      type: object
      properties:
        target:
          type: number
        totalSaved:
          type: number
        percentage:
          type: number
        remaining:
          type: number
        daysUntilWedding:
          type: number
        monthlyNeeded:
          type: number
        groomTotal:
          type: number
        brideTotal:
          type: number
      required: [target, totalSaved, percentage, remaining, daysUntilWedding, monthlyNeeded, groomTotal, brideTotal]

