openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Shared couple login
  - name: savings
    description: Wedding fund tracking
  - name: Storage
    description: Private photo upload and serving
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in to the wedding fund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed-in couple member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getCurrentMember
      tags: [auth]
      summary: Get the current signed-in member
      responses:
        "200":
          description: Signed-in member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "204":
          description: Signed out
  /savings/summary:
    get:
      operationId: getSavingsSummary
      tags: [savings]
      summary: Get the wedding fund summary
      responses:
        "200":
          description: Current progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsSummary"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /savings/entries:
    get:
      operationId: listSavingsEntries
      tags: [savings]
      summary: List all contributions
      responses:
        "200":
          description: Contributions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavingsEntry"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createSavingsEntry
      tags: [savings]
      summary: Add a contribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavingsEntryInput"
      responses:
        "201":
          description: Created contribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsEntry"
        "400":
          description: Invalid contribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /savings/photo:
    get:
      operationId: getWeddingPhoto
      tags: [savings]
      summary: Get the couple's shared photo
      responses:
        "200":
          description: Current shared photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeddingPhoto"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateWeddingPhoto
      tags: [savings]
      summary: Save the couple's shared photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeddingPhotoInput"
      responses:
        "200":
          description: Updated shared photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeddingPhoto"
        "400":
          description: Invalid photo path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [Storage]
      summary: Request a private photo upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [Storage]
      summary: Serve a private uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Uploaded object
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    LoginInput:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required: [username, password]
    Member:
      type: object
      properties:
        username:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [bride, groom]
      required: [username, name, role]
    SavingsEntryInput:
      type: object
      properties:
        amount:
          type: number
          minimum: 0.01
        occurredAt:
          type: string
          format: date-time
        summary:
          type: string
          minLength: 1
          maxLength: 240
        category:
          type: string
          enum: [salary, gift, side-income, other]
      required: [amount, occurredAt, summary, category]
    SavingsEntry:
      type: object
      properties:
        id:
          type: number
        amount:
          type: number
        occurredAt:
          type: string
          format: date-time
        summary:
          type: string
        category:
          type: string
          enum: [salary, gift, side-income, other]
        addedBy:
          type: string
        addedByName:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, amount, occurredAt, summary, category, addedBy, addedByName, createdAt]
    SavingsSummary:
      type: object
      properties:
        target:
          type: number
        totalSaved:
          type: number
        percentage:
          type: number
        remaining:
          type: number
        daysUntilWedding:
          type: number
        monthlyNeeded:
          type: number
      required: [target, totalSaved, percentage, remaining, daysUntilWedding, monthlyNeeded]
    WeddingPhoto:
      type: object
      properties:
        objectPath:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
      required: [objectPath, url]
    WeddingPhotoInput:
      type: object
      properties:
        objectPath:
          type: string
          minLength: 1
          maxLength: 500
      required: [objectPath]
    UploadUrlRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: number
          minimum: 1
        contentType:
          type: string
          minLength: 1
      required: [name, size, contentType]
    UploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
      required: [uploadURL, objectPath, metadata]

